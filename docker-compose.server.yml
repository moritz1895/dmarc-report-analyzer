services:
  dmarc-report-analyzer:
    image: dmarc-report-analyzer:latest
    restart: unless-stopped
    environment:
      # --- IMAP (reads DMARC aggregate reports from the monitored postmaster mailbox) ---
      - DMARC_ANALYZER_MAIL_IMAP_HOST=${IMAP_HOST}
      - DMARC_ANALYZER_MAIL_IMAP_PORT=993
      - DMARC_ANALYZER_MAIL_IMAP_USERNAME=${POSTMASTER_EMAIL}
      - DMARC_ANALYZER_MAIL_IMAP_PASSWORD=${IMAP_PASSWORD}
      # - DMARC_ANALYZER_MAIL_IMAP_USE_SSL=true
      # - DMARC_ANALYZER_MAIL_IMAP_FOLDER=INBOX

      # --- SMTP (sends the summary back to the postmaster mailbox) ---
      - DMARC_ANALYZER_MAIL_SMTP_HOST=${SMTP_HOST}
      - DMARC_ANALYZER_MAIL_SMTP_PORT=587
      - DMARC_ANALYZER_MAIL_SMTP_USERNAME=${POSTMASTER_EMAIL}
      - DMARC_ANALYZER_MAIL_SMTP_PASSWORD=${SMTP_PASSWORD}
      - DMARC_ANALYZER_MAIL_SMTP_FROM_ADDRESS=${POSTMASTER_EMAIL}
      # - DMARC_ANALYZER_MAIL_SMTP_USE_STARTTLS=true

      # --- Recipient of the summary email (typically the same postmaster mailbox) ---
      - DMARC_ANALYZER_MAIL_RECIPIENT=${POSTMASTER_EMAIL}

      # --- Anthropic API (Claude Haiku 4.5 — cheap/lightweight report analysis) ---
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - DMARC_ANALYZER_AI_ANTHROPIC_MODEL=claude-haiku-4-5

      # --- Polling schedule (cron, default: every 15 minutes) ---
      # - DMARC_ANALYZER_SCHEDULE_CRON=0 */15 * * * *

      # --- Logging (set to DEBUG to see per-run/per-email diagnostic detail, e.g. why a
      #     message was skipped or which IMAP/SMTP/AI step is currently running) ---
      # - DMARC_ANALYZER_LOG_LEVEL=DEBUG
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
